name: Molecule test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install 'molecule>=5,<6' 'molecule-podman' 'ansible'
      - name: Run molecule test
        run: molecule test
